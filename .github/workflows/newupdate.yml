name: Update jdkdb
on:
  workflow_dispatch:
    inputs:
      limit-progress:
        description: 'Limit progress updates (0 or empty for no limit)'
        required: false
        default: '10'
      download:
        description: 'Download JDKs to update metadata with checksums'
        required: true
        type: boolean
        default: true
      index:
        description: 'Create indices for the updated metadata'
        required: true
        type: boolean
        default: true
      do_commit:
        description: 'Commit the changes after updating metadata'
        required: true
        type: boolean
        default: true
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  update:
    runs-on: 'ubuntu-latest'
    steps:
    - uses: actions/checkout@v6

    - name: Setup JBang
      uses: jbangdev/setup-jbang@main

    - name: Run scrapers
      env:
        GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        EXTRA_OPTS="${{ inputs.limit-progress }}"
        if [ -n "$EXTRA_OPTS" ] && [ "$EXTRA_OPTS" != "0" ]; then
          EXTRA_OPTS="--limit-progress $EXTRA_OPTS"
        else
          EXTRA_OPTS=""
        fi
        if [ "${{ inputs.download }}" = "false" ]; then
          EXTRA_OPTS="$EXTRA_OPTS --no-download"
        fi
        if [ "${{ inputs.index }}" = "false" ]; then
          EXTRA_OPTS="$EXTRA_OPTS --no-index"
        fi
        jbang --java 21+ https://github.com/jbangdev/jdkdb-scraper/releases/latest/download/jdkdb-scraper-standalone.jar update $EXTRA_OPTS

    - name: Commit & Push changes
      uses: actions-js/push@master
      if: ${{ inputs.do_commit }}
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        message: "Update release metadata"

    - name: Upload log files
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: update-logs
        path: logs/**/*.log
        retention-days: 30
