name: Test
on:
  pushx:
    branches:
    - main
  pull_requestx:
    branches:
    - main
jobs:
  test:
    runs-on: 'ubuntu-latest'
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
    - name: Install dependencies
      run: sudo apt -y install shellcheck
    - name: Run ShellCheck
      run: |
        shellcheck -V
        shellcheck -x bin/*.bash
